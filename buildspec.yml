version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo Installing source NPM dependencies...
      - npm install -g @angular/cli

  pre_build :
    commands:
      - echo Installing source NPM dependencies...
      - npm install

  build:
    commands:
      - echo Build started on `date`
      - echo Building the Angular app...
      - ng build -c production

artifacts:
    files:
      - 'dist/my-angular-project/**/*'
      - 'hook-scripts/**/*'
      - 'appspec.yml'

 